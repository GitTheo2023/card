<title>Theo Arampampaslis</title>
<style>
  :root{--navy:#15203a;--deep:#0c1428;--gold:#c9a467;--gold-d:#a27c45;--gold-l:#ecd6a6;--text:#eef1f7;--muted:#9aa6bf}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--deep);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* one centred column, everything mirrored on the middle line, filling the whole screen */
  .page{position:relative;min-height:100svh;max-width:480px;margin:0 auto;overflow:hidden;
        display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
        padding:calc(env(safe-area-inset-top) + 3.5svh) 22px calc(env(safe-area-inset-bottom) + 2.6svh);
        background:radial-gradient(90% 55% at 50% 14%,rgba(201,164,103,.20),transparent 70%),
                   linear-gradient(180deg,#1b2a4d 0%,#15203a 45%,#0c1428 100%)}
  .page:before{content:"";position:absolute;inset:12px;border:1px solid rgba(201,164,103,.22);border-radius:26px;pointer-events:none}

  .top{display:flex;flex-direction:column;align-items:center}
  .photo{width:min(38vw,19svh,170px);aspect-ratio:1;border-radius:50%;padding:3px;
         background:conic-gradient(from 210deg,#f3dfb2,#a27c45,#e6c88c,#8a6634,#f3dfb2);
         box-shadow:0 0 0 6px rgba(201,164,103,.10),0 14px 34px rgba(0,0,0,.45)}
  .photo img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;border:3px solid var(--deep)}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:clamp(26px,8vw,34px);line-height:1.1;margin:2.4svh 0 0;letter-spacing:.3px;color:#fff}
  .rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:1.3svh 0 0;color:var(--gold)}
  .rule:before,.rule:after{content:"";width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .rule:after{transform:scaleX(-1)}
  .rule span{font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;padding-left:.28em}
  .place{margin:.9svh 0 0;font-size:13.5px;color:var(--muted);letter-spacing:.02em}

  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:360px}
  .act{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.02em;background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
  .act i{width:min(15vw,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
         background:rgba(255,255,255,.05);border:1px solid rgba(201,164,103,.45)}
  .act svg{width:22px;height:22px;stroke:var(--gold-l);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  .details{font-size:14.5px;line-height:1.75;color:var(--text)}
  .details a{color:inherit;text-decoration:none}
  .details .dot{color:var(--gold);padding:0 6px}

  .qr{background:#fff;border-radius:20px;padding:12px 12px 9px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .qr img{display:block;width:min(44vw,21svh,210px);height:auto;aspect-ratio:1;margin:0 auto}
  .qr span{display:block;margin-top:5px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--navy)}

  .bottom{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:1.4svh}
  .save{width:100%;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;text-decoration:none;
        background:linear-gradient(135deg,#ecd29b 0%,#c9a467 45%,#a27c45 100%);color:#16203a;font-weight:700;font-size:16.5px;letter-spacing:.01em;
        box-shadow:0 10px 24px rgba(162,124,69,.35)}
  .save svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .wallet{display:flex;justify-content:center;gap:10px}
  .wallet a{display:block;line-height:0}
  .wallet img{height:44px;width:auto;display:block}
  .wallet a[hidden]{display:none}
  a[href^="tel"],a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#fff;color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.on{opacity:1}
  @media (max-height:600px){.details{font-size:13.5px;line-height:1.6}.save{height:48px}.wallet img{height:40px}.act{font-size:11px}.qr span{display:none}}
</style>
</head>
<body>

<div id="toast"></div>
<script>
const ua = navigator.userAgent, q = new URLSearchParams(location.search);
const iOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (/Android/i.test(ua) && q.get('os') !== 'ios') document.getElementById('apple').hidden = true;
else if (iOS || q.get('os') === 'ios') document.getElementById('google').hidden = true;
const url = 'https://card.arampampaslis.com';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
document.getElementById('share').addEventListener('click', async () => {
  const data = {title: 'Theo Arampampaslis', text: 'Theo Arampampaslis – Business Consultant', url};
  if (navigator.share) { try { await navigator.share(data); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (e) { prompt('Copy this link:', url); }
});
</script>
